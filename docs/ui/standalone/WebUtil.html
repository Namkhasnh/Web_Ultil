  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

n      <p style=\"color:var(--soft); font-size:16px; margin:10px auto 0; max-width:520px;\">Pick a topic and sources — AI writes you a crisp digest in seconds.<\u002Fp>\n    <\u002Fdiv>\n\n    <sc-if value=\"{{ nlIdle }}\" hint-placeholder-val=\"{{ true }}\">\n    <div style=\"background:var(--surface); border:1px solid var(--border); border-radius:22px; padding:30px; margin-top:30px; box-shadow:0 24px 50px -34px rgba(139,92,246,.35);\">\n      <label style=\"font-size:13px; font-weight:600; color:var(--soft);\">Topic or focus<\u002Flabel>\n      <input value=\"{{ topic }}\" onchange=\"{{ setTopic }}\" placeholder=\"e.g. AI breakthroughs this week\" style=\"width:100%; margin-top:8px; padding:14px 16px; background:var(--surface); color:var(--text); border:1.5px solid var(--inbd); border-radius:13px; font-size:15px;\">\n      <label style=\"font-size:13px; font-weight:600; color:var(--soft); display:block; margin-top:20px;\">Sources<\u002Flabel>\n      <div style=\"display:flex; flex-wrap:wrap; gap:9px; margin-top:10px;\">\n        <sc-for list=\"{{ sourceChips }}\" as=\"s\" hint-placeholder-count=\"8\"><div onclick=\"{{ s.onClick }}\" style=\"{{ s.style }}\">{{ s.label }}<\u002Fdiv><\u002Fsc-for>\n      <\u002Fdiv>\n      <div onclick=\"{{ genNl }}\" style=\"margin-top:26px; text-align:center; font-weight:700; color:#fff; font-size:16px; background:linear-gradient(135deg,#8B5CF6,#EC4899); padding:16px; border-radius:14px; cursor:pointer; box-shadow:0 16px 32px -14px rgba(139,92,246,.6);\">✨ Generate Newsletter<\u002Fdiv>\n    <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ nlLoading }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"background:var(--surface); border:1px solid var(--border); border-radius:22px; padding:48px 30px; margin-top:30px; text-align:center;\">\n      <div style=\"width:64px; height:64px; margin:0 auto; border-radius:50%; border:4px solid var(--surface2); border-top-color:#8B5CF6; animation:spin .8s linear infinite;\"><\u002Fdiv>\n      <div style=\"font-family:'Plus Jakarta Sans',sans-serif; font-weight:700; font-size:20px; margin-top:24px;\">{{ nlLoadingTitle }}<\u002Fdiv>\n      <div style=\"display:flex; flex-direction:column; gap:12px; max-width:360px; margin:24px auto 0;\">\n        <sc-for list=\"{{ nlStepList }}\" as=\"st\" hint-placeholder-count=\"4\">\n          <div style=\"display:flex; align-items:center; gap:12px; text-align:left;\">\n            <div style=\"{{ st.dot }}\">{{ st.mark }}<\u002Fdiv>\n            <span style=\"{{ st.text }}\">{{ st.label }}<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ nlDone }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"margin-top:30px; animation:popIn .4s ease;\">\n      <div style=\"background:linear-gradient(135deg,#8B5CF6,#EC4899); border-radius:22px 22px 0 0; padding:32px; color:#fff;\">\n        <div style=\"font-size:13px; font-weight:600; opacity:.85;\">{{ nlDate }} · {{ nlSourceLabel }}<\u002Fdiv>\n        <div style=\"font-family:'Plus Jakarta Sans',sans-serif; font-weight:800; font-size:clamp(24px,4vw,32px); margin-top:8px; line-height:1.1;\">{{ nlTitle }}<\u002Fdiv>\n        <div style=\"font-size:15.5px; opacity:.95; margin-top:12px; line-height:1.6; max-width:600px;\">{{ nlIntro }}<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:var(--surface); border:1px solid var(--border); border-top:none; border-radius:0 0 22px 22px; padding:26px;\">\n        <div style=\"display:flex; align-items:center; gap:8px; font-weight:700; font-size:14px; color:#8B5CF6; letter-spacing:.05em; text-transform:uppercase;\">Top stories <span style=\"{{ nlBadgeStyle }}\">{{ nlBadge }}<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex; flex-direction:column; gap:14px; margin-top:16px;\">\n          <sc-for list=\"{{ nlArticles }}\" as=\"a\" hint-placeholder-count=\"4\">\n            <div style=\"display:flex; gap:16px; padding:16px; border:1px solid var(--border); border-radius:16px;\">\n              <div style=\"width:46px; height:46px; border-radius:12px; flex-shrink:0; background:{{ a.bg }}; display:flex; align-items:center; justify-content:center; font-size:22px;\">{{ a.icon }}<\u002Fdiv>\n              <div style=\"flex:1; min-width:0;\">\n                <div style=\"display:flex; align-items:center; gap:8px; flex-wrap:wrap;\"><span style=\"{{ a.tagStyle }}\">{{ a.tag }}<\u002Fspan><span style=\"color:var(--mute); font-size:12.5px;\">{{ a.source }} · {{ a.time }}<\u002Fspan><\u002Fdiv>\n                <div style=\"font-family:'Plus Jakarta Sans',sans-serif; font-weight:700; font-size:17px; margin-top:7px;\">{{ a.title }}<\u002Fdiv>\n                <div style=\"color:var(--soft); font-size:14px; line-height:1.55; margin-top:6px;\">{{ a.summary }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <div style=\"display:flex; flex-wrap:wrap; gap:10px; margin-top:24px; padding-top:22px; border-top:1px solid var(--border);\">\n          <div onclick=\"{{ copyNl }}\" style=\"font-weight:700; color:#fff; background:linear-gradient(135deg,#8B5CF6,#EC4899); padding:13px 20px; border-radius:12px; cursor:pointer; font-size:14.5px;\">{{ copyLabel }}<\u002Fdiv>\n          <div onclick=\"{{ downloadNl }}\" style=\"font-weight:600; color:var(--soft); background:var(--surface2); padding:13px 20px; border-radius:12px; cursor:pointer; font-size:14.5px;\">⬇ Download as text<\u002Fdiv>\n          <div onclick=\"{{ resetNl }}\" style=\"font-weight:600; color:#8B5CF6; background:rgba(139,92,246,.12); padding:13px 20px; border-radius:12px; cursor:pointer; font-size:14.5px;\">↺ Generate another<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1100,&quot;height&quot;:760},&quot;startPage&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;home&quot;,&quot;pdf&quot;,&quot;image&quot;,&quot;newsletter&quot;],&quot;default&quot;:&quot;home&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;showFloatingChips&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;}}\">\nclass Component extends DCLogic {\n  pdfInputRef = React.createRef();\n  imgInputRef = React.createRef();\n\n  state = {\n    theme: (typeof localStorage!=='undefined' && localStorage.getItem('webutil-theme')) || 'light',\n    page: (this.props && this.props.startPage) || 'home', dragging:null, menuOpen:false, vw:1200,\n    pdfTool:'merge', pdfFiles:[], pdfStage:'idle', pdfProgress:0, pdfResult:null, splitRange:'1, 3-5', compressLevel:'balanced',\n    imgTool:'resize', imgFiles:[], imgStage:'idle', imgProgress:0, imgResults:[], width:1280, height:720, lock:true, format:'WebP', quality:80,\n    topic:'', sources:['AI','Technology'], nlStage:'idle', nlStep:0, nlData:null, nlSource:'sim', copied:false,\n  };\n\n  componentDidMount(){\n    this._onResize=()=>this.setState({vw:window.innerWidth});\n    window.addEventListener('resize', this._onResize);\n    this.setState({vw:window.innerWidth});\n    if(typeof document!=='undefined') document.body.style.background = this.state.theme==='dark' ? '#0C0D15' : '#FBFBFE';\n    this.ensurePdf();\n  }\n  componentWillUnmount(){ clearInterval(this._t); clearInterval(this._nt); if(this._onResize) window.removeEventListener('resize', this._onResize); }\n\n  nav(p){ clearInterval(this._t); clearInterval(this._nt); this.setState({page:p, menuOpen:false, pdfStage:'idle', imgStage:'idle', nlStage:'idle', nlStep:0}); if(window.scrollTo) window.scrollTo(0,0); }\n  toggleTheme(){ this.setState(s=>{ const t=s.theme==='dark'?'light':'dark'; try{localStorage.setItem('webutil-theme',t);}catch(e){} if(typeof document!=='undefined') document.body.style.background = t==='dark'?'#0C0D15':'#FBFBFE'; return {theme:t}; }); }\n\n  fmtSize(b){ if(b==null) return ''; const u=['B','KB','MB','GB']; let i=0,n=b; while(n>=1024&&i<3){n/=1024;i++;} return n.toFixed(n<10&&i>0?1:0)+' '+u[i]; }\n  ensurePdf(){ if(window.PDFLib) return Promise.resolve(); if(this._pdfP) return this._pdfP; this._pdfP=new Promise((res)=>{ const s=document.createElement('script'); s.src='https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js'; s.onload=()=>res(); s.onerror=()=>res(); document.head.appendChild(s); setTimeout(res,9000); }); return this._pdfP; }\n  loadImgEl(url){ return new Promise((res,rej)=>{ const im=new Image(); im.onload=()=>res(im); im.onerror=rej; im.src=url; }); }\n  download(name,url){ const a=document.createElement('a'); a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove(); }\n\n  // ---------- PDF ----------\n  setPdfTool(t){ this.setState({pdfTool:t, pdfStage:'idle', pdfProgress:0}); }\n  async makeSamplePdf(title, pages){ await this.ensurePdf(); const {PDFDocument, StandardFonts, rgb}=window.PDFLib; const doc=await PDFDocument.create(); const font=await doc.embedFont(StandardFonts.HelveticaBold); const reg=await doc.embedFont(StandardFonts.Helvetica); for(let i=0;i<pages;i++){ const p=doc.addPage([595,842]); p.drawRectangle({x:0,y:792,width:595,height:50,color:rgb(0.49,0.23,0.93)}); p.drawText('WebUtil', {x:48,y:808,size:18,font,color:rgb(1,1,1)}); p.drawText(title, {x:48,y:740,size:26,font,color:rgb(0.06,0.07,0.13)}); p.drawText('Page '+(i+1)+' of '+pages, {x:48,y:706,size:12,font:reg,color:rgb(0.45,0.45,0.5)}); p.drawText('This is a real PDF generated in your browser for testing the tools.', {x:48,y:678,size:12,font:reg,color:rgb(0.45,0.45,0.5)}); } return await doc.save(); }\n  async addPdf(list){ await this.ensurePdf(); const files=[...list]; for(let i=0;i<files.length;i++){ const f=files[i]; if(typeof Blob!=='undefined' && f instanceof Blob){ try{ const buf=new Uint8Array(await f.arrayBuffer()); let pages=1; try{ const d=await window.PDFLib.PDFDocument.load(buf,{ignoreEncryption:true}); pages=d.getPageCount(); }catch(e){} this.setState(s=>({pdfFiles:[...s.pdfFiles,{name:f.name||('document-'+(i+1)+'.pdf'),size:f.size||buf.length,pages,bytes:buf}], pdfStage:'idle', dragging:null})); }catch(e){ console.warn(e); } } } }\n  async pdfAddSample(){ const defs=[['report-q2.pdf',8],['invoice-0425.pdf',3],['contract.pdf',12]]; for(const d of defs){ const bytes=await this.makeSamplePdf(d[0].replace('.pdf',''), d[1]); this.setState(s=>({pdfFiles:[...s.pdfFiles,{name:d[0],size:bytes.length,pages:d[1],bytes}], pdfStage:'idle'})); } }\n  removePdf(i){ this.setState(s=>({pdfFiles:s.pdfFiles.filter((_,x)=>x!==i)})); }\n  parseRange(str,max){ const out=[]; (str||'').split(',').forEach(part=>{ part=part.trim(); if(!part) return; if(part.indexOf('-')>=0){ let a=parseInt(part.split('-')[0]); let b=parseInt(part.split('-')[1]); if(isNaN(a)) a=1; if(isNaN(b)) b=max; for(let i=a;i<=b;i++) if(i>=1&&i<=max) out.push(i-1); } else { const n=parseInt(part); if(n>=1&&n<=max) out.push(n-1); } }); return out.length? out : Array.from({length:max},(_,i)=>i); }\n  async runPdf(){ if(!this.state.pdfFiles.length){ await this.pdfAddSample(); return; } await this.ensurePdf(); const {PDFDocument, PDFName}=window.PDFLib; this.setState({pdfStage:'processing',pdfProgress:12}); clearInterval(this._t); this._t=setInterval(()=>this.setState(s=>({pdfProgress:Math.min(90,s.pdfProgress+9)})),110);\n    try{ const files=this.state.pdfFiles; const tool=this.state.pdfTool; let outBytes, name, meta;\n      if(tool==='merge'){ const out=await PDFDocument.create(); for(const f of files){ const src=await PDFDocument.load(f.bytes,{ignoreEncryption:true}); const cp=await out.copyPages(src, src.getPageIndices()); cp.forEach(p=>out.addPage(p)); } outBytes=await out.save(); name='merged.pdf'; meta=`${files.length} files · ${out.getPageCount()} pages · ${this.fmtSize(outBytes.length)}`; }\n      else if(tool==='split'){ const src=await PDFDocument.load(files[0].bytes,{ignoreEncryption:true}); const idx=this.parseRange(this.state.splitRange, src.getPageCount()); const out=await PDFDocument.create(); const cp=await out.copyPages(src, idx); cp.forEach(p=>out.addPage(p)); outBytes=await out.save(); name='split-pages.pdf'; meta=`${idx.length} page${idx.length===1?'':'s'} extracted · ${this.fmtSize(outBytes.length)}`; }\n      else if(tool==='compress'){ const src=await PDFDocument.load(files[0].bytes,{ignoreEncryption:true}); try{ src.setTitle(''); src.setAuthor(''); src.setSubject(''); src.setKeywords([]); src.setProducer(''); src.setCreator(''); }catch(e){} outBytes=await src.save({useObjectStreams:true}); name='compressed.pdf'; const orig=files[0].size||files[0].bytes.length; const saved=Math.max(0,Math.round((1-outBytes.length/orig)*100)); meta=`${this.fmtSize(orig)} → ${this.fmtSize(outBytes.length)} · saved ${saved}%`; }\n      else { const src=await PDFDocument.load(files[0].bytes,{ignoreEncryption:true}); let removed=0; src.getPages().forEach(pg=>{ try{ if(pg.node.has(PDFName.of('Annots'))){ pg.node.delete(PDFName.of('Annots')); removed++; } }catch(e){} }); outBytes=await src.save(); name='cleaned.pdf'; meta=`Watermark layer cleared · ${src.getPageCount()} pages · ${this.fmtSize(outBytes.length)}`; }\n      clearInterval(this._t); const blob=new Blob([outBytes],{type:'application/pdf'}); const url=URL.createObjectURL(blob);\n      this.setState({pdfResult:{name,url,meta}, pdfProgress:100, pdfStage:'done'});\n    }catch(e){ clearInterval(this._t); console.warn('PDF error',e); this.setState({pdfStage:'idle',pdfProgress:0}); }\n  }\n  resetPdf(){ this.setState({pdfStage:'idle',pdfProgress:0,pdfResult:null}); }\n\n  // ---------- IMAGE ----------\n  setImgTool(t){ this.setState({imgTool:t, imgStage:'idle', imgProgress:0, imgResults:[]}); }\n  async addImg(list){ const files=[...list]; for(let i=0;i<files.length;i++){ const f=files[i]; const isBlob=(typeof Blob!=='undefined')&&(f instanceof Blob); if(!isBlob) continue; const url=URL.createObjectURL(f); const rec={name:f.name||('photo-'+(i+1)+'.jpg'), size:f.size||0, url, w:0,h:0}; this.setState(s=>({imgFiles:[...s.imgFiles,rec], imgStage:'idle', dragging:null})); try{ const im=await this.loadImgEl(url); rec.w=im.naturalWidth; rec.h=im.naturalHeight; this.setState(s=>({imgFiles:[...s.imgFiles]})); }catch(e){} } }\n  async imgAddSample(){ const presets=[{n:'sunset-beach.jpg',a:'#FF9A3C',b:'#EC4899',png:false},{n:'ocean-calm.png',a:'#3B6EF6',b:'#22D3EE',png:true}]; for(const p of presets){ const w=1600,h=1200; const c=document.createElement('canvas'); c.width=w;c.height=h; const x=c.getContext('2d'); const g=x.createLinearGradient(0,0,w,h); g.addColorStop(0,p.a); g.addColorStop(1,p.b); x.fillStyle=g; x.fillRect(0,0,w,h); x.globalAlpha=.6; x.fillStyle='#fff'; x.beginPath(); x.arc(w*0.72,h*0.32,150,0,Math.PI*2); x.fill(); x.globalAlpha=.12; x.fillStyle='#000'; for(let i=0;i<7;i++){ x.fillRect(0,h*0.55+i*55,w,26); } x.globalAlpha=1; const blob=await new Promise(r=>c.toBlob(r, p.png?'image/png':'image/jpeg', 0.9)); const url=URL.createObjectURL(blob); this.setState(s=>({imgFiles:[...s.imgFiles,{name:p.n,size:blob.size,url,w,h}], imgStage:'idle'})); } }\n  removeImg(i){ this.setState(s=>{ const f=s.imgFiles[i]; if(f&&f.url) try{URL.revokeObjectURL(f.url);}catch(e){} return {imgFiles:s.imgFiles.filter((_,x)=>x!==i), imgStage:'idle'}; }); }\n  async processOne(rec){ const img=await this.loadImgEl(rec.url); const t=this.state; let w=img.naturalWidth, h=img.naturalHeight; if(t.imgTool==='resize'){ w=Math.max(1,parseInt(t.width)||img.naturalWidth); h=Math.max(1,parseInt(t.height)||img.naturalHeight); } const c=document.createElement('canvas'); c.width=w; c.height=h; const ctx=c.getContext('2d'); ctx.drawImage(img,0,0,w,h); let mime='image/png', q, ext='png'; const srcExt=(rec.name.split('.').pop()||'png').toLowerCase(); if(t.imgTool==='convert'){ const f=t.format.toLowerCase(); if(f==='png'){mime='image/png';ext='png';} else if(f==='webp'){mime='image/webp';ext='webp';q=0.92;} else {mime='image/jpeg';ext='jpg';q=0.92;} } else if(t.imgTool==='compress'){ mime='image/webp'; ext='webp'; q=(parseInt(t.quality)||80)/100; } else { if(srcExt==='png'){mime='image/png';ext='png';} else if(srcExt==='webp'){mime='image/webp';ext='webp';q=0.92;} else {mime='image/jpeg';ext='jpg';q=0.92;} } let blob=await new Promise(res=>c.toBlob(res,mime,q)); if(!blob){ blob=await new Promise(res=>c.toBlob(res,'image/png')); ext='png'; } const url=URL.createObjectURL(blob); const base=rec.name.replace(/\\.[^.]+$/,''); return {name:`${base}-webutil.${ext}`, url, size:blob.size, w, h, origSize:rec.size}; }\n  async runImg(){ if(!this.state.imgFiles.length){ await this.imgAddSample(); return; } this.setState({imgStage:'processing',imgProgress:10,imgResults:[]}); clearInterval(this._t); this._t=setInterval(()=>this.setState(s=>({imgProgress:Math.min(88,s.imgProgress+9)})),110);\n    try{ const results=[]; for(const rec of this.state.imgFiles){ results.push(await this.processOne(rec)); } clearInterval(this._t); this.setState({imgResults:results, imgProgress:100, imgStage:'done'}); }\n    catch(e){ clearInterval(this._t); console.warn('Image error',e); this.setState({imgStage:'idle',imgProgress:0}); }\n  }\n  resetImg(){ this.setState({imgStage:'idle',imgProgress:0,imgResults:[]}); }\n  imgDownload(){ this.state.imgResults.forEach((r,i)=> setTimeout(()=>this.download(r.name,r.url), i*250)); }\n  setWidth(e){ const v=parseInt(e.target.value)||0; this.setState(s=>({width:v, height: s.lock? Math.round(v*9/16): s.height})); }\n  setHeight(e){ const v=parseInt(e.target.value)||0; this.setState(s=>({height:v, width: s.lock? Math.round(v*16/9): s.width})); }\n\n  // ---------- NEWSLETTER ----------\n  toggleSource(s){ this.setState(st=>({sources: st.sources.includes(s)? st.sources.filter(x=>x!==s):[...st.sources,s]})); }\n  cannedDigest(){ return { title:'Your AI & Tech Digest', intro:'Here are the stories worth your time today — AI gets faster and more private, local-first tooling picks up steam, and a new codec quietly makes the web lighter.', articles:[\n    {tag:'AI',source:'The Verge',time:'2h',title:'OpenAI rolls out real-time voice to all free users',summary:'The conversational voice mode now responds in under 300ms and handles interruptions, bringing near-human turn-taking to everyday chats.'},\n    {tag:'Tech',source:'TechCrunch',time:'5h',title:'Apple previews on-device AI that runs offline',summary:'A compact model ships inside the OS, powering summaries and writing tools without sending data to the cloud — a clear privacy play.'},\n    {tag:'Startups',source:'Axios',time:'8h',title:'Browser-tools startup raises $40M to kill the upload',summary:'Investors are betting on local-first software: file processing that never leaves the device, citing speed and privacy as the wedge.'},\n    {tag:'Science',source:'Nature',time:'1d',title:'New codec shrinks images 40% with no visible loss',summary:'A perceptual method trained on human feedback beats WebP on quality-per-byte, and a browser polyfill is already in the works.'} ]}; }\n  genNl(){ this.setState({nlStage:'loading',nlStep:0,copied:false,nlData:null}); this._steps=false; this._ai=null; clearInterval(this._nt);\n    this._nt=setInterval(()=>{ this.setState(s=>{ if(s.nlStep>=3){ clearInterval(this._nt); this._steps=true; this._maybeDone(); return s; } return {nlStep:s.nlStep+1}; }); },800);\n    const topic=this.state.topic||'AI and technology'; const sources=this.state.sources.length?this.state.sources.join(', '):'general tech';\n    const prompt=`You are a tech newsletter editor. Topic: \"${topic}\". Categories: ${sources}. Return ONLY minified JSON, no markdown, shaped exactly: {\"title\":string,\"intro\":string,\"articles\":[{\"tag\":string,\"source\":string,\"time\":string,\"title\":string,\"summary\":string}]} with exactly 4 articles. tag is a one-word category, source is a publication name, time like \"2h\" or \"1d\", summary is 1-2 sentences. Make it realistic and engaging.`;\n    if(typeof window!=='undefined' && window.claude && window.claude.complete){\n      window.claude.complete({messages:[{role:'user',content:prompt}]}).then(txt=>{ try{ const m=txt.replace(/```json/gi,'').replace(/```/g,'').trim(); const j=JSON.parse(m.slice(m.indexOf('{'), m.lastIndexOf('}')+1)); if(j&&j.articles&&j.articles.length){ this._ai={data:j,src:'ai'}; } else { this._ai={data:this.cannedDigest(),src:'sim'}; } }catch(e){ this._ai={data:this.cannedDigest(),src:'sim'}; } this._maybeDone(); }).catch(()=>{ this._ai={data:this.cannedDigest(),src:'sim'}; this._maybeDone(); });\n    } else { setTimeout(()=>{ this._ai={data:this.cannedDigest(),src:'sim'}; this._maybeDone(); }, 1200); }\n  }\n  _maybeDone(){ if(this._steps && this._ai){ this.setState({nlStage:'done', nlData:this._ai.data, nlSource:this._ai.src}); } }\n  resetNl(){ this.setState({nlStage:'idle',nlStep:0,copied:false,nlData:null}); }\n  digestText(d){ let t=`${d.title}\\n${this.nlDateStr()} · ${this.state.sources.join(' · ')||'All sources'}\\n\\n${d.intro}\\n\\n`; d.articles.forEach((a,i)=>{ t+=`${i+1}. [${a.tag}] ${a.title}\\n   ${a.source} · ${a.time}\\n   ${a.summary}\\n\\n`; }); t+='— Generated with WebUtil'; return t; }\n  copyNl(){ const d=this.state.nlData||this.cannedDigest(); const txt=this.digestText(d); try{ navigator.clipboard.writeText(txt); }catch(e){} this.setState({copied:true}); clearTimeout(this._ct); this._ct=setTimeout(()=>this.setState({copied:false}),1600); }\n  downloadNl(){ const d=this.state.nlData||this.cannedDigest(); const blob=new Blob([this.digestText(d)],{type:'text/plain'}); const url=URL.createObjectURL(blob); this.download('webutil-digest.txt',url); }\n  nlDateStr(){ return 'June 17, 2026'; }\n  tagMeta(tag){ const t=(tag||'').toLowerCase(); if(t.indexOf('ai')>=0||t.indexOf('ml')>=0) return {c:'#8B5CF6',i:'🤖'}; if(t.indexOf('start')>=0) return {c:'#FF7A3C',i:'🚀'}; if(t.indexOf('sci')>=0||t.indexOf('research')>=0) return {c:'#16A34A',i:'🔬'}; if(t.indexOf('design')>=0) return {c:'#EC4899',i:'🎨'}; if(t.indexOf('secur')>=0) return {c:'#DC2626',i:'🔒'}; if(t.indexOf('crypto')>=0||t.indexOf('finance')>=0) return {c:'#F59E0B',i:'🪙'}; if(t.indexOf('business')>=0) return {c:'#0EA5E9',i:'📈'}; return {c:'#3B6EF6',i:'⚡'}; }\n\n  tabStyle(sel,accent){ return sel\n    ? `display:flex;align-items:center;gap:9px;padding:12px 18px;border-radius:13px;font-weight:700;font-size:15px;cursor:pointer;background:var(--surface);color:${accent};border:1.5px solid ${accent}55;box-shadow:0 12px 26px -16px ${accent};`\n    : `display:flex;align-items:center;gap:9px;padding:12px 18px;border-radius:13px;font-weight:600;font-size:15px;cursor:pointer;background:var(--surface);color:var(--mute);border:1.5px solid var(--border);`; }\n\n  renderVals(){\n    const st=this.state; const mobile = st.vw < 760;\n    const PDF_DEFS=[{id:'merge',label:'Merge',icon:'🔗',desc:'Combine several PDFs into one file, in the order you choose.'},{id:'split',label:'Split',icon:'✂️',desc:'Pull out specific pages into a new document.'},{id:'compress',label:'Compress',icon:'🗜️',desc:'Re-save and slim down your PDF, locally.'},{id:'watermark',label:'Remove Watermark',icon:'🧼',desc:'Strip annotation & stamp watermarks from every page.'}];\n    const IMG_DEFS=[{id:'resize',label:'Resize',icon:'📐',desc:'Set exact pixel dimensions, with optional aspect lock.'},{id:'convert',label:'Convert',icon:'🔄',desc:'Switch between PNG, JPG and WebP instantly.'},{id:'compress',label:'Compress',icon:'🗜️',desc:'Reduce file size with a quality slider and live preview.'}];\n    const navColor=(p)=> st.page===p ? (p==='pdf'?'#FF5470':p==='image'?'#3B6EF6':'#8B5CF6') : 'var(--soft)';\n\n    const compOpt=(id,label,desc)=>{ const sel=st.compressLevel===id; return {label,desc,onClick:()=>this.setState({compressLevel:id}), style:`display:flex;align-items:center;justify-content:space-between;padding:13px 15px;border-r o'];\n    const srcChip=(label)=>{ const sel=st.sources.includes(label); return {label,onClick:()=>this.toggleSource(label), style:`padding:9px 16px;border-radius:999px;font-weight:600;font-size:14px;cursor:pointer;border:1.5px solid ${sel?'#8B5CF6':'var(--border)'};background:${sel?'linear-gradient(135deg,#8B5CF6,#EC4899)':'var(--surface)'};color:${sel?'#fff':'var(--soft)'};`}; };\n    const STEP_LABELS=['Collecting sources','Reading the latest articles','Summarizing with AI','Composing your digest'];\n    const stepItem=(label,i)=>{ const done=i<st.nlStep, active=i===st.nlStep; return {label, mark: done?'✓':'', dot:`width:24px;height:24px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#fff;background:${done?'#16A34A':active?'#8B5CF6':'var(--surface2)'};${active&&!done?'animation:pulseDot 1s ease-in-out infinite;':''}`, text:`font-size:14.5px;font-weight:${active||done?'600':'400'};color:${done?'#22A95A':active?'var(--text)':'var(--mute)'};`}; };\n    const digest = st.nlData || this.cannedDigest();\n    const artItem=(a)=>{ const m=this.tagMeta(a.tag); return {icon:m.i,bg:m.c+'22',tag:a.tag,source:a.source,time:a.time,title:a.title,summary:a.summary, tagStyle:`background:${m.c}22;color:${m.c};font-weight:700;font-size:11.5px;padding:3px 9px;border-radius:999px;`}; };\n    const isAi = st.nlSource==='ai';\n\n    return {\n      theme: st.theme, themeIcon: st.theme==='dark'?'☀️':'🌙', toggleTheme:()=>this.toggleTheme(),\n      goHome:()=>this.nav('home'), goPdf:()=>this.nav('pdf'), goImage:()=>this.nav('image'), goNl:()=>this.nav('newsletter'),\n      navPdfColor:navColor('pdf'), navImageColor:navColor('image'), navNlColor:navColor('newsletter'),\n      navLinksStyle: mobile? 'display:none' : 'display:flex;align-items:center;gap:clamp(14px,2.4vw,28px);',\n      navBurgerStyle: mobile? 'display:flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:10px;background
